<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Catatan Konten</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f6fa;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .card {
    max-width: 520px;
    margin: 20px auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h2 { margin-top: 0; font-size: 19px; }
  label { font-size: 13px; font-weight: 600; display: block; margin: 14px 0 6px; }
  input[type="email"], input[type="password"], input[type="url"], input[type="text"], input[type="file"], textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    background: #2b3a67;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: #c0392b; }
  .msg.success { color: #27ae60; }
  #logoutBtn { background: #999; margin-top: 8px; }
  #cancelEditBtn { background: #999; margin-top: 8px; display: none; }
  .preview { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .preview img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }
  .preview-item { position: relative; width: 70px; height: 70px; }
  .preview-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; display: block; }
  .preview-item .removeBtn {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #c0392b;
    color: #fff;
    border: none;
    font-size: 12px;
    line-height: 20px;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }

  .post-item {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .post-item .date { font-size: 11px; color: #999; }
  .post-item .caption { font-size: 14px; margin: 4px 0; white-space: pre-wrap; }
  .post-item .thumbs { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }
  .post-item .thumbs img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
  .post-item .link { font-size: 12px; color: #2b3a67; word-break: break-all; }
  .post-item .actions { display: flex; gap: 8px; margin-top: 8px; }
  .post-item .actions button {
    width: auto;
    margin-top: 0;
    padding: 6px 14px;
    font-size: 12px;
    border-radius: 6px;
  }
  .post-item .editBtn { background: #2b3a67; }
  .post-item .deleteBtn { background: #c0392b; }
  .post-item .shareBtn { background: #197278; }
  .empty { text-align: center; color: #999; font-size: 13px; padding: 10px 0; }

  .admin-search-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .admin-search-wrap input {
    width: 100%;
    padding: 10px 34px 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
    box-sizing: border-box;
  }
  .admin-search-wrap .clearSearchBtn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #999;
    font-size: 15px;
    cursor: pointer;
    width: auto;
    padding: 4px;
    display: none;
  }
  .admin-search-count {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
  }
  .post-item mark {
    background: #ffe083;
    color: inherit;
    padding: 0 1px;
    border-radius: 2px;
  }

  .link-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .link-row input[type="text"] {
    flex: 0 0 35%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
  }
  .link-row input[type="url"] {
    flex: 1;
  }
  .link-row button {
    width: auto;
    margin: 0;
    padding: 0 12px;
    background: #c0392b;
    border-radius: 8px;
  }
  #addLinkBtn {
    background: white;
    color: #2b3a67;
    border: 1.5px dashed #2b3a67;
    margin-top: 8px;
    padding: 8px;
    font-size: 13px;
  }
/* ===== Responsive Layout ===== */

html{
  scroll-behavior:smooth;
}

body{
  width:100%;
}

.page-wrap{
  width:100%;
  max-width:700px;
  margin:0 auto;
  padding:16px;
}

img{
  max-width:100%;
  height:auto;
  display:block;
}

iframe{
  max-width:100%;
}

.ads-banner{

}

.gallery{

  grid-template-columns:repeat(3,1fr);

.gallery img{

}

/* Tablet */
@media (min-width:768px){

  }

  .gallery{
    gap:12px;
  }

  h1{

  }
}

/* Desktop */
@media (min-width:1200px){
  .page-wrap{
    max-width:1100px;
  }

  .gallery{
    gap:16px;
  }

  h1{
    font-size:36px;
  }
}
</style>

<body>

<script type="module">

  apiKey: "AIzaSyD-7D1tKtRAtFu9aOneL8TfpInol7WFORc",
  authDomain: "vipku-6f309.firebaseapp.com",
  projectId: "vipku-6f309",
  storageBucket: "vipku-6f309.firebasestorage.app",
  messagingSenderId: "449274305179",
  appId: "1:449274305179:web:4221a82e358a500c00843e",
  measurementId: "G-M02GCZ8LTL"
};

// API key gratis dari https://api.imgbb.com/ - dipakai untuk upload foto
const IMGBB_API_KEY = "42fd13de011d1800659343811eddc8da";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

async function uploadToImgbb(file) {
  const formData = new FormData();
  formData.append("image", file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
    method: "POST",
    body: formData
  });
  const data = await res.json();
  if (!data.success) {
    throw new Error(data.error?.message || "Upload ke ImgBB gagal");
  }
  return data.data.url;
}

const loginCard = document.getElementById("loginCard");
const formCard = document.getElementById("formCard");
const listCard = document.getElementById("listCard");
const contactCard = document.getElementById("contactCard");
const chipBarCard = document.getElementById("chipBarCard");
const loginMsg = document.getElementById("loginMsg");
const formMsg = document.getElementById("formMsg");
const formTitle = document.getElementById("formTitle");
const submitBtn = document.getElementById("submitBtn");
const cancelEditBtn = document.getElementById("cancelEditBtn");
const existingPreview = document.getElementById("existingPreview");

let selectedFiles = [];
let editingId = null;
let editingExistingPhotos = [];

document.getElementById("adminSearchInput").addEventListener("input", applyAdminSearch);
document.getElementById("adminSearchClear").addEventListener("click", () => {
  document.getElementById("adminSearchInput").value = "";
  applyAdminSearch();
  document.getElementById("adminSearchInput").focus();
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginCard.style.display = "none";
    formCard.style.display = "block";
    listCard.style.display = "block";
    contactCard.style.display = "block";
    chipBarCard.style.display = "block";
    loadContactSettings();
    loadChipBarSettings();
    listenPosts();
  } else {
    loginCard.style.display = "block";
    formCard.style.display = "none";
    listCard.style.display = "none";
    contactCard.style.display = "none";
    chipBarCard.style.display = "none";
  }
});

document.getElementById("loginBtn").onclick = async () => {
  loginMsg.textContent = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    loginMsg.textContent = "Login gagal: email/password salah.";
  }
};

document.getElementById("logoutBtn").onclick = () => signOut(auth);

document.getElementById("photos").addEventListener("change", (e) => {
  selectedFiles = Array.from(e.target.files);
  const preview = document.getElementById("preview");
  preview.innerHTML = "";
  selectedFiles.forEach(file => {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    preview.appendChild(img);
  });
});

const linksContainer = document.getElementById("linksContainer");

function addLinkRow(label = "", url = "") {
  const row = document.createElement("div");
  row.className = "link-row";
  row.innerHTML = `
    <input type="text" placeholder="Nama (mis. Kuis)" value="${escapeAttr(label)}">
    <input type="url" placeholder="https://..." value="${escapeAttr(url)}">
    <button type="button">✕</button>
  `;
  row.querySelector("button").onclick = () => row.remove();
  linksContainer.appendChild(row);
}

function getLinksFromForm() {
  const rows = linksContainer.querySelectorAll(".link-row");
  const links = [];
  rows.forEach((row) => {
    const inputs = row.querySelectorAll("input");
    const label = inputs[0].value.trim();
    const url = inputs[1].value.trim();
    if (url) {
      links.push({ label: label || "Buka video", url });
    }
  });
  return links;
}

function getTagsFromForm() {
  const raw = document.getElementById("tags").value.trim();
  if (!raw) return [];
  return raw.split(",").map(t => t.trim()).filter(Boolean);
}

function escapeAttr(str) {
  return String(str).replace(/"/g, "&quot;");
}

document.getElementById("addLinkBtn").onclick = () => addLinkRow();
addLinkRow(); // baris kosong pertama saat halaman dibuka

function resetForm() {
  editingId = null;
  editingExistingPhotos = [];
  formTitle.textContent = "📤 Tambah Konten Baru";
  submitBtn.textContent = "Bagikan Konten";
  cancelEditBtn.style.display = "none";
  document.getElementById("photos").value = "";
  document.getElementById("preview").innerHTML = "";
  existingPreview.innerHTML = "";
  linksContainer.innerHTML = "";
  addLinkRow();
  document.getElementById("tags").value = "";
  document.getElementById("caption").value = "";
  document.getElementById("resultLink").style.display = "none";
  selectedFiles = [];
  formMsg.textContent = "";
}

cancelEditBtn.onclick = resetForm;

submitBtn.onclick = async () => {
  formMsg.className = "msg";
  formMsg.textContent = "";

  const links = getLinksFromForm();
  const tags = getTagsFromForm();
  const caption = document.getElementById("caption").value.trim();

  if (selectedFiles.length === 0 && editingExistingPhotos.length === 0 && links.length === 0 && !caption) {
    formMsg.className = "msg error";
    formMsg.textContent = "Isi minimal satu: foto, link, atau catatan.";
    return;
  }

  submitBtn.disabled = true;
  formMsg.textContent = "Memproses...";

  try {
    const photoUrls = [...editingExistingPhotos];
    let i = 0;
    for (const file of selectedFiles) {
      i++;
      formMsg.textContent = `Mengunggah foto ${i} dari ${selectedFiles.length}...`;
      const url = await uploadToImgbb(file);
      photoUrls.push(url);
    }

    formMsg.textContent = "Menyimpan data...";

    if (editingId) {
      await updateDoc(doc(db, "posts", editingId), {
        photoUrls,
        links,
        tags,
        caption: caption || null
      });
      formMsg.className = "msg success";
      formMsg.textContent = "Materi berhasil diperbarui!";

      const editedUrl = `${window.location.origin}/?post=${editingId}`;
      const editedResultEl = document.getElementById("resultLink");
      editedResultEl.style.display = "block";
      editedResultEl.innerHTML = `Link konten ini:<br><b>${editedUrl}</b><br><button type="button" class="shareBtn" style="width:auto; margin-top:8px; padding:8px 14px; font-size:12px; border-radius:6px; color:#fff; border:none; cursor:pointer;">🔗 Bagikan</button>`;
      editedResultEl.querySelector(".shareBtn").onclick = () => sharePostLink(editedUrl);

      resetFieldsOnly();
    } else {
      const docRef = await addDoc(collection(db, "posts"), {
        photoUrls,
        links,
        tags,
        caption: caption || null,
        createdAt: serverTimestamp()
      });
      formMsg.className = "msg success";
      formMsg.textContent = "Berhasil dibagikan konten!";

      const postUrl = `${window.location.origin}/?post=${docRef.id}`;
      const resultEl = document.getElementById("resultLink");
      resultEl.style.display = "block";
      resultEl.innerHTML = `Link khusus konten ini:<br><b>${postUrl}</b><br><button type="button" class="shareBtn" style="width:auto; margin-top:8px; padding:8px 14px; font-size:12px; border-radius:6px; color:#fff; border:none; cursor:pointer;">🔗 Bagikan</button>`;
      resultEl.querySelector(".shareBtn").onclick = () => sharePostLink(postUrl);
      resetFieldsOnly();
    }
  } catch (err) {
    formMsg.className = "msg error";
    formMsg.textContent = "Gagal: " + err.message;
    console.error(err);
  } finally {
    submitBtn.disabled = false;
  }
};

function resetFieldsOnly() {
  document.getElementById("photos").value = "";
  document.getElementById("preview").innerHTML = "";
  selectedFiles = [];
  if (!editingId) {
    linksContainer.innerHTML = "";
    addLinkRow();
    document.getElementById("tags").value = "";
    document.getElementById("caption").value = "";
  }
}

function startEdit(id, data) {
  editingId = id;
  editingExistingPhotos = data.photoUrls || [];
  formTitle.textContent = "✏️ Edit konten";
  submitBtn.textContent = "Simpan Perubahan";
  cancelEditBtn.style.display = "block";

  linksContainer.innerHTML = "";
  const existingLinks = data.links || (data.taskLink ? [{ label: "Buka video", url: data.taskLink }] : []);
  if (existingLinks.length === 0) {
    addLinkRow();
  } else {
    existingLinks.forEach(l => addLinkRow(l.label, l.url));
  }

  document.getElementById("tags").value = (data.tags || []).join(", ");
  document.getElementById("caption").value = data.caption || "";
  document.getElementById("resultLink").style.display = "none";

  existingPreview.innerHTML = "";
  renderExistingPreview();

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderExistingPreview() {
  existingPreview.innerHTML = "";
  editingExistingPhotos.forEach((url) => {
    const wrap = document.createElement("div");
    wrap.className = "preview-item";
    wrap.innerHTML = `
      <img src="${url}" title="Foto lama">
      <button type="button" class="removeBtn">✕</button>
    `;
    wrap.querySelector(".removeBtn").onclick = () => {
      editingExistingPhotos = editingExistingPhotos.filter(u => u !== url);
      renderExistingPreview();
    };
    existingPreview.appendChild(wrap);
  });
}

async function removePost(id) {
  if (!confirm("Yakin hapus materi ini? Tidak bisa dikembalikan.")) return;
  try {
    await deleteDoc(doc(db, "posts", id));
  } catch (err) {
    alert("Gagal menghapus: " + err.message);
  }
}

let allPostsCache = []; // [{ id, data }]

function normalizeSearchText(str) {
  return (str || "")
    .toString()
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // buang diakritik biar lebih akurat
    .trim();
}

function getPostSearchBlob(data) {
  const tagsList = data.tags || [];
  const linksList = data.links || (data.taskLink ? [{ label: "Buka Link", url: data.taskLink }] : []);
  const parts = [
    data.caption || "",
    tagsList.join(" "),
    linksList.map(l => `${l.label || ""} ${l.url || ""}`).join(" ")
  ];
  return normalizeSearchText(parts.join(" "));
}

function highlightMatch(text, terms) {
  if (!text) return "";
  let escaped = escapeHtml(text);
  if (!terms.length) return escaped;
  terms.forEach(term => {
    if (!term) return;
    const safeTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("(" + safeTerm + ")", "gi");
    escaped = escaped.replace(re, "<mark>$1</mark>");
  });
  return escaped;
}

function listenPosts() {
  const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    allPostsCache = [];
    snapshot.forEach((docSnap) => {
      allPostsCache.push({ id: docSnap.id, data: docSnap.data() });
    });
    applyAdminSearch();
  });
}

function applyAdminSearch() {
  const listEl = document.getElementById("postList");
  const countEl = document.getElementById("adminSearchCount");
  const clearBtn = document.getElementById("adminSearchClear");
  const rawQuery = document.getElementById("adminSearchInput").value;
  const normalizedQuery = normalizeSearchText(rawQuery);
  const terms = normalizedQuery.split(/\s+/).filter(Boolean);

  clearBtn.style.display = rawQuery ? "block" : "none";

  const filtered = terms.length
    ? allPostsCache.filter(({ data }) => {
        const blob = getPostSearchBlob(data);
        return terms.every(term => blob.includes(term));
      })
    : allPostsCache;

  if (terms.length) {
    countEl.textContent = `${filtered.length} dari ${allPostsCache.length} postingan cocok`;
  } else {
    countEl.textContent = "";
  }

  if (allPostsCache.length === 0) {
    listEl.innerHTML = '<p class="empty">Belum ada materi.</p>';
    return;
  }
  if (filtered.length === 0) {
    listEl.innerHTML = '<p class="empty">Tidak ada postingan yang cocok dengan pencarian.</p>';
    return;
  }

  listEl.innerHTML = "";
  filtered.forEach(({ id, data }) => {
    const date = data.createdAt?.toDate
      ? data.createdAt.toDate().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" })
      : "";

    const thumbs = (data.photoUrls || [])
      .map(url => `<img src="${url}">`)
      .join("");

    const linksList = data.links || (data.taskLink ? [{ label: "Buka Link", url: data.taskLink }] : []);
    const linksHtml = linksList
      .map(l => `<div class="link">🔗 ${highlightMatch(l.label, terms)}: ${highlightMatch(l.url, terms)}</div>`)
      .join("");

    const tagsList = data.tags || [];
    const tagsHtml = tagsList.length
      ? `<div class="link">🏷️ ${tagsList.map(t => highlightMatch(t, terms)).join(", ")}</div>`
      : "";

    const item = document.createElement("div");
    item.className = "post-item";
    item.innerHTML = `
      <div class="date">${date}</div>
      ${data.caption ? `<div class="caption">${highlightMatch(data.caption, terms)}</div>` : ""}
      <div class="thumbs">${thumbs}</div>
      ${linksHtml}
      ${tagsHtml}
      <div class="actions">
        <button class="editBtn">Edit</button>
        <button class="shareBtn">🔗 Bagikan</button>
        <button class="deleteBtn">Hapus</button>
      </div>
    `;
    const postUrl = `${window.location.origin}/?post=${id}`;
    item.querySelector(".editBtn").onclick = () => startEdit(id, data);
    item.querySelector(".shareBtn").onclick = () => sharePostLink(postUrl);
    item.querySelector(".deleteBtn").onclick = () => removePost(id);
    listEl.appendChild(item);
  });
}

async function sharePostLink(url) {
  const shareData = { url: url };
  if (navigator.share) {
    try {
      await navigator.share(shareData);
    } catch (err) {
      // Pengguna membatalkan share, tidak perlu ditampilkan sebagai error
    }
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(url);
      alert("Link disalin! Silakan tempel ke aplikasi yang diinginkan.");
    } catch (err) {
      prompt("Salin link ini secara manual:", url);
    }
  } else {
    prompt("Salin link ini secara manual:", url);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
