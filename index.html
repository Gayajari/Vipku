<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, doc, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyD-7D1tKtRAtFu9aOneL8TfpInol7WFORc",
  authDomain: "vipku-6f309.firebaseapp.com",
  projectId: "vipku-6f309",
  storageBucket: "vipku-6f309.firebasestorage.app",
  messagingSenderId: "449274305179",
  appId: "1:449274305179:web:4221a82e358a500c00843e",
  measurementId: "G-M02GCZ8LTL"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================== FAVICON (dari dasbor admin, di-cache di localStorage) ================== */
// Cache biar tab icon langsung muncul tanpa nunggu round-trip ke Firestore
// tiap kali situs dibuka, dan biar gak boros baca Firestore tiap page load.
const FAVICON_CACHE_KEY = "vipku_favicon_cache";
const FAVICON_CACHE_TTL = 6 * 60 * 60 * 1000; // 6 jam — cukup cepat kalau admin ganti favicon, gak boros baca

function applyFaviconTag(url) {
  if (!url) return;
  const link = document.getElementById("siteFavicon");
  if (link) link.href = url;
}

function loadCachedFavicon() {
  try {
    const cached = JSON.parse(localStorage.getItem(FAVICON_CACHE_KEY) || "null");
    if (cached && cached.url) {
      applyFaviconTag(cached.url);
      return cached;
    }
  } catch (err) {
    console.warn("Cache favicon rusak, diabaikan:", err);
  }
  return null;
}

async function refreshFaviconFromServer() {
  try {
    const snap = await getDoc(doc(db, "settings", "favicon"));
    if (snap.exists() && snap.data().url) {
      const url = snap.data().url;
      applyFaviconTag(url);
      localStorage.setItem(FAVICON_CACHE_KEY, JSON.stringify({ url, cachedAt: Date.now() }));
    }
  } catch (err) {
    console.error("Gagal memuat favicon dari server:", err);
  }
}

(function initFavicon() {
  const cached = loadCachedFavicon(); // pasang versi cache dulu — instan, tanpa flicker
  const isStale = !cached || (Date.now() - cached.cachedAt > FAVICON_CACHE_TTL);
  if (isStale) refreshFaviconFromServer(); // baru cek ke server kalau cache kosong/basi
})();


// GANTI dengan URL backend Vercel kamu setelah deploy folder paywall-backend
const PAYWALL_BACKEND_URL = "https://vipkuu.vercel.app";

function getBuyerId() {
  let id = localStorage.getItem("buyerId");
  if (!id) {
    id = "b_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("buyerId", id);
  }
  return id;
}

async function handlePaidLinkClick(postId, linkIndex, price, label, btnEl) {
  const buyerId = getBuyerId();
  const accessId = `${buyerId}_${postId}_${linkIndex}`;
  const originalText = btnEl.textContent;
  btnEl.disabled = true;

  try {
    btnEl.textContent = "Mengecek status...";
    const accessSnap = await getDoc(doc(db, "paidAccess", accessId));
    const accessData = accessSnap.exists() ? accessSnap.data() : null;
    const isStillValid =
      accessData &&
      accessData.status === "paid" &&
      (!accessData.expiresAt || new Date(accessData.expiresAt) > new Date());

    if (isStillValid) {
      btnEl.textContent = "Membuka...";
      const opened = await openPaidLink({ postId, linkIndex, buyerId, label, btnEl });
      if (!opened) btnEl.textContent = originalText;
      btnEl.disabled = false;
      return;
    }

    btnEl.textContent = "Menyiapkan pembayaran...";
    const res = await fetch(`${PAYWALL_BACKEND_URL}/api/create-transaction`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ postId, linkIndex, price, buyerId, label })
    });
    const resData = await res.json();

    if (resData.alreadyPaid) {
      btnEl.disabled = false;
      return handlePaidLinkClick(postId, linkIndex, price, label, btnEl);
    }
    if (resData.qrisImage) {
      btnEl.textContent = originalText;
      btnEl.disabled = false;
      openQrisModal({ postId, linkIndex, buyerId, label, btnEl, invoiceData: resData });
      return;
    }
    alert(resData.error || "Gagal membuat transaksi pembayaran.");
    btnEl.textContent = originalText;
  } catch (err) {
    console.error(err);
    alert("Terjadi kesalahan koneksi ke server pembayaran. Coba lagi.");
    btnEl.textContent = originalText;
  } finally {
    btnEl.disabled = false;
  }
}

/* ================== BUKA LINK BERBAYAR (SHORTLINK PERMANEN + SAVE HINT) ================== */

// Ambil {url, shortUrl} dari backend, buka shortUrl (bukan url mentah) di tab
// baru, terus tampilin tombol "Salin Link" biar bisa disave/bookmark buat
// dibuka lagi nanti tanpa balik ke situs. shortUrl selalu ngecek ulang status
// bayar + ambil tujuan TERBARU tiap kali dibuka (lihat api/l/[token].js),
// jadi aman disave dan otomatis ngikutin kalau admin ganti link di dasbor.
async function openPaidLink({ postId, linkIndex, buyerId, label, btnEl }) {
  try {
    const res = await fetch(`${PAYWALL_BACKEND_URL}/api/get-link`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ postId, linkIndex, buyerId })
    });
    const resData = await res.json();
    if (resData.url) {
      const openUrl = resData.shortUrl || resData.url;
      window.open(openUrl, "_blank", "noopener,noreferrer");
      btnEl.textContent = "🔓 " + label;
      if (resData.shortUrl) showSavedLinkHint(btnEl, resData.shortUrl);
      return true;
    }
    alert(resData.error || "Gagal membuka link.");
    return false;
  } catch (err) {
    console.error(err);
    alert("Terjadi kesalahan koneksi ke server pembayaran. Coba lagi.");
    return false;
  }
}

// Nampilin link + tombol "Salin" di bawah tombol, biar pembeli bisa
// simpan/bookmark buat akses lagi nanti tanpa harus balik ke situs.
function showSavedLinkHint(btnEl, shortUrl) {
  const existing = btnEl.parentElement.querySelector(".saved-link-hint");
  if (existing) existing.remove();

  const hint = document.createElement("div");
  hint.className = "saved-link-hint";
  hint.style.cssText = "font-size:11px; color:#888; margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;";
  hint.innerHTML = `
    <span>💾 Simpan link ini biar bisa buka lagi kapan aja:</span>
    <button type="button" style="font-size:11px; padding:3px 10px; border-radius:6px; border:1px solid #ccc; background:#f5f6fa; cursor:pointer;">📋 Salin Link</button>
  `;
  const copyBtn = hint.querySelector("button");
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(shortUrl);
      copyBtn.textContent = "✅ Tersalin!";
      setTimeout(() => { copyBtn.textContent = "📋 Salin Link"; }, 1800);
    } catch (err) {
      prompt("Salin link ini manual:", shortUrl);
    }
  });
  btnEl.insertAdjacentElement("afterend", hint);
}

/* ================== MODAL QRIS (DONGTUBE PAYMENT) ================== */

let qrisUnsub = null; // listener status pembayaran realtime
let qrisCountdownTimer = null; // countdown kadaluarsa QRIS

function closeQrisModal() {
  document.getElementById("qrisModalOverlay").classList.remove("open");
  if (qrisUnsub) { qrisUnsub(); qrisUnsub = null; }
  if (qrisCountdownTimer) { clearInterval(qrisCountdownTimer); qrisCountdownTimer = null; }
}

document.getElementById("qrisModalClose").addEventListener("click", closeQrisModal);
document.getElementById("qrisModalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "qrisModalOverlay") closeQrisModal();
});

function setQrisModalStatus(text, kind) {
  const el = document.getElementById("qrisModalStatus");
  if (!text) {
    el.className = "";
    el.innerHTML = "";
    return;
  }
  el.className = "manual-modal-status " + kind;
  el.textContent = text;
}

function openQrisModal({ postId, linkIndex, buyerId, label, btnEl, invoiceData }) {
  const overlay = document.getElementById("qrisModalOverlay");
  const accessId = `${buyerId}_${postId}_${linkIndex}`;

  document.getElementById("qrisModalTitle").textContent = label;
  document.getElementById("qrisModalPrice").textContent =
    "Rp " + Number(invoiceData.total || invoiceData.amount).toLocaleString("id-ID");
  document.getElementById("qrisModalImg").src = invoiceData.qrisImage;
  setQrisModalStatus("⏳ Menunggu pembayaran... scan QRIS di atas pakai e-wallet/m-banking. Halaman ini otomatis update begitu lunas.", "pending");
  overlay.classList.add("open");

  if (qrisUnsub) { qrisUnsub(); qrisUnsub = null; }
  if (qrisCountdownTimer) { clearInterval(qrisCountdownTimer); qrisCountdownTimer = null; }

  const expiryEl = document.getElementById("qrisModalExpiry");
  expiryEl.textContent = "";
  if (invoiceData.expiredAt) {
    const expiryDate = new Date(invoiceData.expiredAt);
    qrisCountdownTimer = setInterval(() => {
      const diff = expiryDate - new Date();
      if (diff <= 0) {
        expiryEl.textContent = "QRIS sudah kadaluarsa.";
        setQrisModalStatus("❌ QRIS kadaluarsa. Tutup modal ini lalu klik tombol bayar lagi buat bikin QRIS baru.", "rejected");
        clearInterval(qrisCountdownTimer);
        qrisCountdownTimer = null;
        return;
      }
      const mins = Math.floor(diff / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      expiryEl.textContent = `Berlaku ${mins}:${String(secs).padStart(2, "0")} lagi`;
    }, 1000);
  }

  qrisUnsub = onSnapshot(doc(db, "paidAccess", accessId), (snap) => {
    if (!snap.exists()) return;
    const data = snap.data();
    if (data.status === "paid") {
      if (qrisCountdownTimer) { clearInterval(qrisCountdownTimer); qrisCountdownTimer = null; }
      setQrisModalStatus("✅ Pembayaran diterima! Membuka link...", "verified");
      setTimeout(async () => {
        closeQrisModal();
        btnEl.textContent = "Membuka...";
        btnEl.disabled = true;
        const opened = await openPaidLink({ postId, linkIndex, buyerId, label, btnEl });
        if (!opened) btnEl.textContent = label;
        btnEl.disabled = false;
      }, 900);
    }
  }, (err) => {
    console.error("Gagal memantau status pembayaran QRIS:", err);
  });
}

let manualPaymentMethodsCache = null;
async function getManualPaymentMethods() {
  if (manualPaymentMethodsCache) return manualPaymentMethodsCache;
  try {
    const snap = await getDoc(doc(db, "settings", "manualPayment"));
    manualPaymentMethodsCache = snap.exists() ? (snap.data().methods || []) : [];
  } catch (err) {
    console.error(err);
    manualPaymentMethodsCache = [];
  }
  return manualPaymentMethodsCache;
}

async function openManualBuyLink(postId, linkIndex, buyerId, btnEl) {
  try {
    const res = await fetch(`${PAYWALL_BACKEND_URL}/api/get-link`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ postId, linkIndex, buyerId })
    });
    const resData = await res.json();
    if (resData.url) {
      const openUrl = resData.shortUrl || resData.url;
      window.open(openUrl, "_blank", "noopener,noreferrer");
      if (btnEl) {
        btnEl.textContent = "🔓 Terverifikasi — buka lagi";
        if (resData.shortUrl) showSavedLinkHint(btnEl, resData.shortUrl);
      }
    } else {
      alert(resData.error || "Gagal membuka link.");
    }
  } catch (err) {
    console.error(err);
    alert("Gagal terhubung ke server. Coba lagi.");
  }
}

async function openManualPaymentModal(postId, linkIndex, price, label, btnEl) {
  const buyerId = getBuyerId();
  const overlay = document.getElementById("manualModalOverlay");
  const priceEl = document.getElementById("manualModalPrice");
  const methodsEl = document.getElementById("manualModalMethods");
  const formEl = document.getElementById("manualModalForm");

  document.getElementById("manualModalTitle").textContent = label;
  priceEl.textContent = "Rp " + price.toLocaleString("id-ID");
  setManualModalStatus("", "");
  formEl.style.display = "none";
  methodsEl.innerHTML = '<p style="font-size:12px; color:#888;">Memuat metode pembayaran...</p>';
  overlay.classList.add("open");

  if (manualOrderUnsub) { manualOrderUnsub(); manualOrderUnsub = null; }

  const methods = await getManualPaymentMethods();
  methodsEl.innerHTML = methods.length
    ? methods.map(m => `
        <div class="manual-method-card">
          <div class="mm-name">${escapeHtml(m.name)}</div>
          ${m.detail ? `<div>${escapeHtml(m.detail)}</div>` : ""}
          ${m.qrImageUrl ? `<img src="${m.qrImageUrl}" alt="QR ${escapeHtml(m.name)}">` : ""}
        </div>
      `).join("")
    : '<p style="font-size:12px; color:#c0392b;">Metode pembayaran belum diatur admin. Hubungi admin dulu.</p>';

  // Cek klaim TERBARU untuk kombinasi buyer+post+link ini, dan pantau live
  // (kalau admin verifikasi SAAT modal masih terbuka, otomatis update).
  const q = query(
    collection(db, "manualOrders"),
    where("buyerId", "==", buyerId),
    where("postId", "==", postId),
    where("linkIndex", "==", linkIndex),
    orderBy("createdAt", "desc"),
    limit(1)
  );

  manualOrderUnsub = onSnapshot(q, (snapshot) => {
    if (snapshot.empty) {
      formEl.style.display = "block";
      setManualModalStatus("", "");
      return;
    }
    const orderData = snapshot.docs[0].data();
    if (orderData.status === "pending") {
      formEl.style.display = "none";
      setManualModalStatus("⏳ Klaim kamu sedang menunggu diverifikasi admin. Halaman ini akan otomatis update begitu diverifikasi.", "pending");
    } else if (orderData.status === "verified") {
      formEl.style.display = "none";
      setManualModalStatus("✅ Pembayaran terverifikasi! Membuka link...", "verified");
      openManualBuyLink(postId, linkIndex, buyerId, btnEl);
    } else if (orderData.status === "rejected") {
      formEl.style.display = "block";
      setManualModalStatus("❌ Klaim sebelumnya ditolak admin (mungkin bukti tidak sesuai). Kamu bisa kirim klaim baru di bawah.", "rejected");
    }
  }, (err) => {
    console.error("Gagal memantau status order manual:", err);
  });

  document.getElementById("manualSubmitBtn").onclick = async () => {
    const submitBtn = document.getElementById("manualSubmitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Mengirim klaim...";
    try {
      await addDoc(collection(db, "manualOrders"), {
        buyerId,
        postId,
        linkIndex,
        price,
        label,
        contact: document.getElementById("manualContactInput").value.trim() || null,
        note: document.getElementById("manualNoteInput").value.trim() || null,
        status: "pending",
        createdAt: serverTimestamp()
      });
      submitBtn.textContent = "Saya Sudah Transfer";
    } catch (err) {
      console.error(err);
      alert("Gagal mengirim klaim: " + err.message);
      submitBtn.textContent = "Saya Sudah Transfer";
    } finally {
      submitBtn.disabled = false;
    }
  };
}

async function loadCustomChipBar() {
  try {
    const snap = await getDoc(doc(db, "settings", "chipbar"));
    if (!snap.exists()) return;
    const data = snap.data();
    const slots = [
      { name: data.chip1Name, link: data.chip1Link, active: data.chip1Active !== false },
      { name: data.chip2Name, link: data.chip2Link, active: data.chip2Active !== false },
      { name: data.chip3Name, link: data.chip3Link, active: data.chip3Active !== false }
    ];
    let html = "";
    slots.forEach(({ name, link, active }) => {
      if (name && link && active) {
        html += `<a href="${escapeHtmlAttr(link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(name)}</a>`;
      }
    });
    postChipBarHtml = html ? `<div class="post-chip-bar">${html}</div>` : "";
  } catch (err) {
    console.error("Gagal memuat chip bar custom:", err);
  }
}

function escapeHtmlAttr(str) {
  return String(str).replace(/"/g, "&quot;");
}

function loadCategoryBar() {
  const bar = document.getElementById("categoryBar");
  const qAll = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(200));
  onSnapshot(qAll, (snapshot) => {
    allDocsCache = snapshot.docs;
    renderOldPostsRotation();

    const allTags = new Set();
    snapshot.forEach((docSnap) => {
      (docSnap.data().tags || []).forEach((t) => allTags.add(t));
    });
    if (allTags.size === 0) {
      bar.innerHTML = "";
      return;
    }
    let html = `<a class="category-chip${!tagParam ? " active" : ""}" href="${window.location.origin}/">Semua</a>`;
    allTags.forEach((t) => {
      const isActive = tagParam === t;
      html += `<a class="category-chip${isActive ? " active" : ""}" href="?tag=${encodeURIComponent(t)}">#${escapeHtml(t)}</a>`;
    });
    bar.innerHTML = html;
  });
}

function renderOldPostsRotation() {
  const wrap = document.getElementById("oldRotationWrap");
  if (!wrap) return;

  // Rotasi cuma tampil di halaman utama, bukan di mode post/tag
  if (postId || tagParam) {
    wrap.innerHTML = "";
    return;
  }

  const pool = allDocsCache.slice(MAIN_FEED_LIMIT);
  if (pool.length === 0) {
    wrap.innerHTML = "";
    return;
  }

  const today = new Date().toISOString().slice(0, 10);
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem("oldPostsRotation") || "null");
  } catch (err) {
    saved = null;
  }

  let chosenIds;
  if (saved && saved.date === today && Array.isArray(saved.ids) && saved.ids.length > 0) {
    chosenIds = saved.ids;
  } else {
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    chosenIds = shuffled.slice(0, 3).map((d) => d.id);
    try {
      localStorage.setItem("oldPostsRotation", JSON.stringify({ date: today, ids: chosenIds }));
    } catch (err) {
      // localStorage tidak tersedia, lewati saja
    }
  }

  const chosenDocs = chosenIds
    .map((id) => pool.find((d) => d.id === id))
    .filter(Boolean);

  wrap.innerHTML = "";
  if (chosenDocs.length === 0) return;

  const header = document.createElement("div");
  header.className = "section-title";
  header.textContent = "🎲 Konten Pilihan";
  wrap.appendChild(header);
  chosenDocs.forEach((d) => wrap.appendChild(renderPost(d)));
}

function setupSearch() {
  const input = document.getElementById("searchInput");
  const btn = document.getElementById("searchBtn");
  const clearBtn = document.getElementById("clearBtn");
  const suggestBox = document.getElementById("searchSuggestions");

  input.addEventListener("input", (e) => {
    const qText = e.target.value.trim().toLowerCase();
    clearBtn.style.display = e.target.value ? "block" : "none";

    if (!qText) {
      suggestBox.classList.remove("show");
      suggestBox.innerHTML = "";
      if (searchActive) {
        searchActive = false;
        location.reload();
      }
      return;
    }

    renderSuggestions(qText);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      runFullSearch(input.value.trim());
    }
  });

  btn.addEventListener("click", () => {
    runFullSearch(input.value.trim());
  });

  clearBtn.addEventListener("click", () => {
    input.value = "";
    clearBtn.style.display = "none";
    suggestBox.classList.remove("show");
    suggestBox.innerHTML = "";
    if (searchActive) {
      searchActive = false;
      location.reload();
    }
    input.focus();
  });

  document.addEventListener("click", (e) => {
    if (!suggestBox.contains(e.target) && e.target !== input) {
      suggestBox.classList.remove("show");
    }
  });
}

function renderSuggestions(qText) {
  const suggestBox = document.getElementById("searchSuggestions");
  const matchedTags = new Set();
  const matchedPosts = [];

  allDocsCache.forEach((docSnap) => {
    const data = docSnap.data();
    (data.tags || []).forEach((t) => {
      if (t.toLowerCase().includes(qText)) matchedTags.add(t);
    });
    if (data.caption && data.caption.toLowerCase().includes(qText)) {
      matchedPosts.push({ id: docSnap.id, caption: data.caption });
    }
  });

  let html = "";
  Array.from(matchedTags).slice(0, 5).forEach((t) => {
    html += `<a class="search-suggestion-item" href="?tag=${encodeURIComponent(t)}">🏷️ <span class="tag-label">#${escapeHtml(t)}</span></a>`;
  });
  matchedPosts.slice(0, 5).forEach((p) => {
    html += `<a class="search-suggestion-item" href="?post=${p.id}">📄 ${escapeHtml(p.caption)}</a>`;
  });

  if (!html) {
    html = `<div class="search-suggestion-item" style="color:#999;">Tidak ada saran</div>`;
  }

  suggestBox.innerHTML = html;
  suggestBox.classList.add("show");
}

function runFullSearch(qTextRaw) {
  const suggestBox = document.getElementById("searchSuggestions");
  suggestBox.classList.remove("show");
  const qText = qTextRaw.toLowerCase();

  if (!qText) {
    searchActive = false;
    location.reload();
    return;
  }

  searchActive = true;
  const filtered = allDocsCache.filter((docSnap) => {
    const data = docSnap.data();
    const tags = data.tags || [];
    const matchTag = tags.some((t) => t.toLowerCase().includes(qText));
    const matchCaption = (data.caption || "").toLowerCase().includes(qText);
    return matchTag || matchCaption;
  });

  postsEl.innerHTML = "";
  const header = document.createElement("div");
  header.className = "section-title";
  header.textContent = "Hasil Pencarian";
  postsEl.appendChild(header);

  if (filtered.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Tidak ada konten yang cocok.";
    postsEl.appendChild(empty);
  } else {
    filtered.forEach((d) => postsEl.appendChild(renderPost(d)));
  }
}

function renderPost(docSnap) {
  const data = docSnap.data();
  const date = data.createdAt?.toDate
    ? data.createdAt.toDate().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" })
    : "";

  const photoUrls = data.photoUrls || [];
  const photos = photoUrls
    .map(url => `<img src="${url}" onclick="openLightbox('${url}')">`)
    .join("");
  const photosClass = photoUrls.length > 1 ? "post-photos multi" : "post-photos single";

  const linksList = data.links || (data.taskLink ? [{ label: "Buka video", url: data.taskLink }] : []);
  const linkBtns = linksList
    .map((l, idx) => {
      if (l.price > 0) {
        const priceLabel = Number(l.price).toLocaleString("id-ID");
        const category = l.category === "manual" ? "manual" : "auto";
        return `<button type="button" class="post-link post-link-paid" data-post-id="${docSnap.id}" data-link-index="${idx}" data-price="${l.price}" data-label="${escapeHtmlAttr(l.label)}" data-category="${category}">🔒 ${escapeHtml(l.label)} — Rp ${priceLabel}</button>`;
      }
      return `<a class="post-link" href="${escapeHtmlAttr(l.url)}" target="_blank" rel="noopener noreferrer">▶️ ${escapeHtml(l.label)}</a>`;
    })
    .join("");

  const caption = data.caption
    ? `<div class="post-caption">${escapeHtml(data.caption)}</div>`
    : "";

  const tagsList = data.tags || [];
  const tagsHtml = tagsList.length
    ? `<div class="post-tags">${tagsList.map(t => `<a class="tag-chip" href="?tag=${encodeURIComponent(t)}">#${escapeHtml(t)}</a>`).join("")}</div>`
    : "";

  const shareUrl = `${window.location.origin}/?post=${docSnap.id}`;

  const post = document.createElement("div");
  post.className = "post";
  post.innerHTML = `
    <div class="post-date">${date}</div>
    ${caption}
    ${tagsHtml}
    <div class="${photosClass}">${photos}</div>
    ${linkBtns}
    ${postChipBarHtml}
    <button class="post-share" onclick="sharePost('${shareUrl}')">🔗 Bagikan Konten</button>
  `;

  post.querySelectorAll(".post-link-paid").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.category === "manual") {
        openManualPaymentModal(
          btn.dataset.postId,
          Number(btn.dataset.linkIndex),
          Number(btn.dataset.price),
          btn.dataset.label,
          btn
        );
      } else {
        handlePaidLinkClick(
          btn.dataset.postId,
          Number(btn.dataset.linkIndex),
          Number(btn.dataset.price),
          btn.dataset.label,
          btn
        );
      }
    });
  });

  return post;
}

} else if (tagParam) {

  onSnapshot(qTag, (snapshot) => {
    if (searchActive) return;
    postsEl.innerHTML = "";

    header.className = "section-title";
    header.textContent = `Tag: ${tagParam}`;
    postsEl.appendChild(header);

      empty.textContent = "Belum ada konten dengan tag ini.";
      postsEl.appendChild(empty);
    } else {
      snapshot.forEach((d) => postsEl.appendChild(renderPost(d)));
    }

    const seeAll = document.createElement("a");
    seeAll.className = "post-link";
    seeAll.href = window.location.origin + "/";
    seeAll.textContent = "📂 Lihat Semua Konten";
    postsEl.appendChild(seeAll);
  });
} else {
 
  const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(MAIN_FEED_LIMIT));
  onSnapshot(q, (snapshot) => {
    if (searchActive) return;
    if (snapshot.empty) {
      postsEl.innerHTML = '<p class="empty">Belum ada konten.</p>';
      return;
    }

    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const sevenDaysAgo = new Date(startOfToday.getTime() - 6 * 24 * 60 * 60 * 1000);

    const groups = { hariIni: [], mingguIni: [], lebihLama: [] };

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const created = data.createdAt?.toDate ? data.createdAt.toDate() : null;
      if (created && created >= startOfToday) {
        groups.hariIni.push(docSnap);
      } else if (created && created >= sevenDaysAgo) {
        groups.mingguIni.push(docSnap);
      } else {
        groups.lebihLama.push(docSnap);
      }
    });

    postsEl.innerHTML = "";
    let feedPostCounter = 0;
    const sections = [
      { key: "hariIni", label: "Hari Ini" },
      { key: "mingguIni", label: "Minggu Ini" },
      { key: "lebihLama", label: "Lebih Lama" }
    ];

    sections.forEach(({ key, label }) => {
      if (groups[key].length === 0) return;
      const title = document.createElement("div");
      title.className = "section-title";
      title.textContent = label;
      postsEl.appendChild(title);
      groups[key].forEach((docSnap) => {
        postsEl.appendChild(renderPost(docSnap));
        feedPostCounter++;
        if (feedPostCounter % 3 === 0) {
          try {
            postsEl.appendChild(createNativeAdSlot());
          } catch (err) {
            console.error("Gagal memuat native ad slot:", err);
          }
        }
      });
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

window.openLightbox = function(url) {
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").style.display = "flex";
};

window.sharePost = async function(url) {
  const shareData = { url: url };

  if (navigator.share) {
    try {
      await navigator.share(shareData);
    } catch (err) {
      // Pengguna membatalkan share, tidak perlu ditampilkan sebagai error
    }
  } else if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(url);
      alert("Link disalin! Silakan tempel ke aplikasi yang diinginkan.");
    } catch (err) {
      prompt("Salin link ini secara manual:", url);
    }
  } else {
    prompt("Salin link ini secara manual:", url);
  }
};
</script>
